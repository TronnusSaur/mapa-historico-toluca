<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Fondo Institucional Toluca -->
  <rect width="256" height="256" rx="48" fill="#51162C"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Proyección de Luz / Haces Laterales (Estilizados) -->
    <!-- Haz Izquierdo -->
    <path d="M 86,132 L 28,110 M 86,148 L 24,168" stroke="#D4AF37" stroke-width="8"/>
    <path d="M 80,140 L 40,140" stroke="#D4AF37" stroke-width="6" stroke-dasharray="10 8"/>

    <!-- Haz Derecho -->
    <path d="M 170,132 L 228,110 M 170,148 L 232,168" stroke="#D4AF37" stroke-width="8"/>
    <path d="M 176,140 L 216,140" stroke="#D4AF37" stroke-width="6" stroke-dasharray="10 8"/>

    <!-- Linterna / Cúpula Superior (Líneas Gruesas Blancas) -->
    <!-- Remate Superior / Baliza Pequeña -->
    <path d="M 128,46 L 128,54" stroke="#FFFFFF" stroke-width="8"/>

    <!-- Techo / Cúpula Triangular -->
    <path d="M 128,54 L 92,94 L 164,94 Z" fill="#51162C" stroke="#FFFFFF" stroke-width="9"/>

    <!-- Cámara de la Lámpara (Ventanal) -->
    <path d="M 98,94 L 98,154 M 158,94 L 158,154" stroke="#FFFFFF" stroke-width="9"/>
    
    <!-- Base / Barandal de la Linterna -->
    <path d="M 82,154 L 174,154" stroke="#FFFFFF" stroke-width="11"/>
    <!-- Repisa Inferior -->
    <path d="M 94,170 L 162,170" stroke="#FFFFFF" stroke-width="9"/>
    
    <!-- Montantes Centrales del Cristal -->
    <path d="M 116,94 L 116,154 M 140,94 L 140,154" stroke="#FFFFFF" stroke-width="6" opacity="0.6"/>

    <!-- Núcleo de Luz / Foco Emisor -->
    <circle cx="128" cy="124" r="14" fill="#D4AF37" stroke="#FFFFFF" stroke-width="5"/>
  </g>
</svg>
